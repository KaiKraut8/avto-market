display_errors = On
error_reporting = E_ALL
memory_limit = 512M
date.timezone = UTC

; car photos: several phone photos per upload (nginx allows 40 MB per request)
upload_max_filesize = 10M
post_max_size = 40M
max_file_uploads = 20

; when Xdebug is on, debug only requests that ask for it (browser extension or ?XDEBUG_TRIGGER=1)
xdebug.start_with_request = trigger
xdebug.client_port = 9003
