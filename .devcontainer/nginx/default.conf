# Laravel: every request that isn't a real file goes to public/index.php.
# Only index.php is ever executed, so old addresses like /edit.php?id=2 reach Laravel
# (which redirects them) instead of returning 404.
server {
    listen 8000;
    server_name _;
    root /workspaces/kai/public;
    index index.php;
    charset utf-8;

    # car photos are uploaded through Laravel; leave room for several phone photos at once
    client_max_body_size 40m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
