# On every push to main: build, run the tests, then upload to kai.alcoyne.dev over SSH.
# If a test fails, nothing is uploaded.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button in the Actions tab

# Never run two deploys at once
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kai_test
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      KAI_DB_HOST: 127.0.0.1
      KAI_DB_PORT: 3306
      KAI_DB_USERNAME: root
      KAI_DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5" # keep in step with the server's PHP
          extensions: bcmath, gd, intl, mbstring, pdo_mysql, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Build assets
        run: npm run build

      - name: Run tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test
          rm .env

      - name: Drop dev dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      # rsync --delete into a wrong path wipes everything the SSH user owns, so refuse unless
      # DEPLOY_PATH is an absolute path at least two levels deep and holds the .deploy-target marker
      # (created once by hand on the server).
      - name: Check target
        run: |
          if [[ ! "$SSH_HOST" || ! "$SSH_USER" || ! "$DEPLOY_PATH" =~ ^/[^/]+/[^/]+ ]]; then
            echo "::error::SSH_HOST, SSH_USER or DEPLOY_PATH secret is missing or DEPLOY_PATH is not a deep absolute path"
            exit 1
          fi
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "test -f '$DEPLOY_PATH/.deploy-target'" \
            || { echo "::error::$DEPLOY_PATH/.deploy-target not found on the server"; exit 1; }

      # The server's .env, storage/ and uploads are excluded, so they are never overwritten or deleted.
      # Files arrive owned by the SSH user, group www-data (setgid dirs), group-writable.
      - name: Upload files
        run: |
          rsync -rlptz --delete --omit-dir-times --no-owner --no-group --chmod=D2775,F664 \
            -e "ssh -p $SSH_PORT" \
            --exclude='/.deploy-target' \
            --exclude='/.env' \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.devcontainer/' \
            --exclude='/.vscode/' \
            --exclude='/.claude/' \
            --exclude='/node_modules/' \
            --exclude='/tests/' \
            --exclude='/storage/' \
            --exclude='/bootstrap/cache/' \
            --exclude='/public/storage' \
            --exclude='/public/hot' \
            --exclude='/backups/' \
            --exclude='/photos-inbox/' \
            --exclude='/legacy/public/uploads/' \
            --exclude='/*.sql' \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      # artisan runs as www-data so the files it writes in storage/ stay writable for Apache
      - name: Migrate and cache
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && { [ -e public/storage ] || sudo -u www-data php artisan storage:link; } && sudo -u www-data php artisan migrate --force && sudo -u www-data php artisan optimize && sudo -u www-data php artisan queue:restart"
